<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StableWatch 판정기 시안 H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --sky:#D3DBE6; --paper:#DCE3EC; --card:#E8EDF3; --line:#B4BFCE; --ink:#3A4250; --ink-2:#6E7889; --ink-3:#8993A4;
    --mark:#E85D57; --blue:#14181F; --amber:#B98A2E;
    --sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;word-break:keep-all;padding:32px 20px}
  button,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  .app{max-width:1240px;margin:0 auto;background:var(--paper);display:grid;grid-template-columns:56px minmax(0,1fr)}
  .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
  .logo{width:32px;height:32px;background:var(--ink);display:grid;place-items:center;margin-bottom:10px;border-radius:8px}
  .rail button{width:36px;height:36px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer;position:relative}
  .rail button:hover{background:rgba(255,255,255,.45);color:var(--ink)}
  .rail button.on{background:rgba(255,255,255,.6);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .rail svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rail button::after{content:attr(data-t);position:absolute;left:44px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;z-index:5}
  .rail button:hover::after,.rail button:focus-visible::after{opacity:1}
  .main{min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 32px;flex-wrap:wrap}
  .top h1{margin:0;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .top .r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .notice{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
  .top select{border:1px solid var(--line);background:transparent;padding:5px 8px;cursor:pointer;font-weight:500}

  .home{padding:12px 32px 40px}
  .lede{font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:24px 0 6px;line-height:1.35}
  .sub{color:var(--ink-2);margin:0 0 32px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);margin-bottom:32px}
  .stats div{padding:22px 26px;border-right:1px solid var(--line)}.stats div:last-child{border-right:0}
  .stats span{display:block;font-size:12px;color:var(--ink-3)}
  .stats b{display:block;font-size:32px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
  .stats small{color:var(--ink-2);font-size:12px}
  .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;margin-bottom:56px}
  .ch h2{margin:0 0 2px;font-size:15px;font-weight:600}
  .ch p{margin:0 0 18px;font-size:12px;color:var(--ink-2)}
  .plot{position:relative;height:210px;margin-left:34px}
  .ax{position:absolute;left:-34px;width:28px;text-align:right;font-size:11px;color:var(--ink-3);transform:translateY(50%)}
  .gl{position:absolute;left:0;right:0;border-top:1px solid rgba(58,66,80,.12)}
  .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;border-bottom:1px solid var(--ink)}
  .col{position:relative;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column-reverse;align-items:center;height:100%}
  .col.on{outline:2px solid var(--blue);outline-offset:3px}
  .col .sg{width:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;overflow:hidden;border-top:1px solid var(--paper)}
  .col .sg.d{color:var(--ink)}
  .dcol{justify-content:flex-start;flex-direction:column-reverse}
  .dcol i{display:block;width:min(30px,60%);background:#B4BFCE}
  .dcol.on i{background:var(--ink)}
  .dcol .v{font-size:11px;color:var(--ink-2);margin-bottom:3px;position:absolute}
  .lim{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mark);pointer-events:none;z-index:2}
  .lim span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--mark);background:var(--paper);padding:0 4px}
  .lim.g{border-top-color:var(--ink-3)}.lim.g span{color:var(--ink-2)}
  .xl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:8px 0 0 34px;font-size:11px;color:var(--ink-2);text-align:center;line-height:1.3}
  .xl .on{color:var(--ink);font-weight:600}
  .leg{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 0 34px;font-size:12px;color:var(--ink-2)}
  .leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:10px;height:10px;display:inline-block}
  .k0{background:var(--blue)}.k1{background:#7A8494}.k2{background:#A3ACBA}.k3{background:#98A2B2}.k4{background:#C9D1DC}
  .home h2.sec{font-size:18px;font-weight:600;margin:0 0 4px}
  .home p.sec{color:var(--ink-2);margin:0 0 18px;font-size:13px}
  .cty{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
  .ct{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:26px 26px 24px;cursor:pointer}
  .ct:nth-child(3n){border-right:0}.ct:nth-last-child(-n+3){border-bottom:0}
  .ct:hover{background:rgba(255,255,255,.4)}
  .ct .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:8px}
  .ct h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
  .ct .t span{font-size:12px;color:var(--ink-2)}
  .strip{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-bottom:14px}
  .strip i{display:block;height:18px;background:rgba(58,66,80,.12)}
  .strip i.met{background:var(--blue)}.strip i.unmet{background:var(--mark)}.strip i.caution{background:var(--amber)}
  .ct p{margin:0;font-size:13px;color:var(--ink-2)}.ct p+p{margin-top:2px;color:var(--ink-3);font-size:12px}

  .stage{display:grid;grid-template-columns:130px minmax(0,1fr);min-height:600px;padding-right:32px}
  .mark{position:relative}
  .wm{position:absolute;left:30px;top:10px;font-family:"Noto Sans SC","Noto Sans KR",sans-serif;font-weight:700;font-size:84px;line-height:.98;color:rgba(58,66,80,.16);white-space:pre;user-select:none}
  .wm.lat{font-size:62px}
  .sideL{position:absolute;left:34px;bottom:30px;writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg);color:var(--ink-2);font-size:13px}
  .board{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-content:start;align-self:start;border:1px solid var(--line);margin-top:10px}
  .cardL{border-right:1px solid var(--line);display:flex;flex-direction:column}
  .cardL .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:22px 24px 0}
  .cardL h2{margin:0;font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .live{text-align:right;font-size:12px;color:var(--ink-2)}.live b{display:block;color:var(--ink);font-weight:600;font-size:14px}
  .sun{position:relative;height:150px;margin-top:26px;overflow:hidden;border-bottom:1px solid var(--line)}
  .sun svg{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%)}
  .sun .n{position:absolute;right:20px;top:10px;font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
  .desc{padding:20px 24px 26px;font-size:13px;color:var(--ink-2);line-height:1.7;margin:0}
  .desc small{display:block;margin-top:10px;font-size:12px;color:var(--ink-3)}

  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;padding:16px 10px;cursor:pointer;font-size:15px;color:var(--ink-2)}
  .tabs button:last-child{border-right:0}
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--mark);background:rgba(255,255,255,.4)}
  .who{padding:12px 20px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line)}
  .who b{color:var(--ink);font-weight:600}
  .item{border-bottom:1px solid var(--line)}
  .ih{display:grid;grid-template-columns:44px minmax(0,1fr) 72px;gap:8px;padding:14px 18px 14px 20px;align-items:baseline;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
  .ih:hover{background:rgba(255,255,255,.35)}
  .item.on .ih{background:rgba(255,255,255,.55);box-shadow:inset 3px 0 0 var(--blue)}
  .ih .id{font-weight:600}.ih .nm{color:var(--ink-2)}.item.on .nm{color:var(--ink);font-weight:500}
  .ih .st{text-align:right;font-size:13px;color:var(--ink-3)}
  .st.met{color:var(--blue);font-weight:600}.st.unmet{color:var(--mark);font-weight:600}.st.caution{color:var(--amber);font-weight:600}
  .ib{padding:6px 20px 18px 64px;background:rgba(255,255,255,.55);font-size:13px;color:var(--ink-2)}
  .ib .row{display:flex;gap:28px;margin:6px 0 10px}.ib .row span{display:block;font-size:12px;color:var(--ink-3)}.ib .row b{font-size:20px;font-weight:600;color:var(--ink)}
  .ib p{margin:0 0 6px}.ib a{color:var(--blue)}
  .ib .art{color:var(--ink)}
  .cands label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}.cands input{accent-color:var(--blue);margin-top:4px}
  .cands p{font-size:12px;color:var(--ink-3)}
  .more{display:block;width:100%;border:0;background:transparent;padding:16px 20px;text-align:left;color:var(--ink-2);cursor:pointer;font-size:13px}
  .more:hover{color:var(--ink)}

  .rp{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 20px;cursor:pointer}
  .rp:hover{background:rgba(255,255,255,.35)}
  .rp.on{background:rgba(255,255,255,.55);box-shadow:inset 3px 0 0 var(--blue)}
  .rp .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .rp .h b{font-size:15px;font-weight:600}.rp .h em{font-style:normal;font-size:12px;color:var(--blue);font-weight:600}
  .rp .is{font-size:12px;color:var(--ink-3);margin:0 0 10px}
  .rp dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;margin:0}
  .rp dt{font-size:11px;color:var(--ink-3)}.rp dd{margin:0;font-size:13px;color:var(--ink)}
  .tag{display:inline-block;margin:16px 20px 0;border:1px solid var(--amber);color:#7d5c17;font-size:12px;padding:3px 10px}
  .hkw{padding:12px 20px;border-bottom:1px solid var(--line)}
  .hkw .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
  .hkw .l span:last-child{color:var(--ink-2)}
  .trk{position:relative;height:12px;background:transparent}
  .trk i{position:absolute;left:0;top:0;bottom:0;display:block}
  .trk .a{background:#B4BFCE}.trk .b{background:var(--ink)}
  .note{padding:14px 20px;font-size:12px;color:var(--ink-2);line-height:1.7;margin:0}
  .none{padding:32px 20px;font-size:14px;color:var(--ink)}
  .none small{display:block;margin-top:6px;font-size:12px;color:var(--ink-2)}
  .leg2{display:flex;gap:14px;padding:12px 20px 0;font-size:12px;color:var(--ink-2)}.leg2 span{display:inline-flex;gap:5px;align-items:center}.leg2 i{width:10px;height:10px;display:inline-block}

  .nav{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:32px}
  .nav button{flex:1;min-width:110px;border:0;border-right:1px solid var(--line);background:transparent;padding:16px 8px;cursor:pointer;color:var(--ink-2);font-size:15px}
  .nav button:last-child{border-right:0}
  .nav button[aria-pressed="true"]{color:var(--ink);font-weight:700;background:rgba(255,255,255,.4);box-shadow:inset 0 -3px 0 var(--mark)}
  .nav small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
  .foot{padding:14px 32px 28px;font-size:12px;color:var(--ink-3);margin:0}
  .hide{display:none!important}
  @media (max-width:900px){
    body{padding:0}
    .app{grid-template-columns:minmax(0,1fr)}
    .rail{order:3;flex-direction:row;justify-content:center;border-right:0;border-top:1px solid var(--line);padding:8px}
    .logo{margin:0 10px 0 0}.rail button::after{display:none}
    .top{padding:8px 16px}.home{padding:0 16px 32px}.foot{padding:12px 16px 24px}
    .lede{font-size:21px}
    .stats{grid-template-columns:1fr}.stats div{border-right:0;border-bottom:1px solid var(--line)}.stats div:last-child{border-bottom:0}
    .charts{grid-template-columns:1fr;gap:36px;margin-bottom:40px}
    .cty{grid-template-columns:1fr}.ct{border-right:0!important;border-bottom:1px solid var(--line)!important}.ct:last-child{border-bottom:0!important}
    .stage{grid-template-columns:1fr;min-height:0;padding:0 16px}
    .mark{height:86px}.wm{left:0;top:6px;font-size:56px;white-space:normal}.wm.lat{font-size:44px}.sideL{display:none}
    .board{grid-template-columns:1fr;margin-top:0}
    .cardL{border-right:0;border-bottom:1px solid var(--line)}
    .ib{padding-left:20px}
    .nav button{min-width:33.3%;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="메뉴">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:none"><rect x="2" y="2" width="5" height="5" fill="#fff"/><rect x="9" y="2" width="5" height="5" fill="#fff"/><rect x="2" y="9" width="5" height="5" fill="#fff"/><rect x="9.5" y="9.5" width="4" height="4" fill="none" stroke="#fff" stroke-width="1"/></svg></div>
    <button type="button" id="rHome" data-t="개요" aria-label="개요"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
    <button type="button" id="rCty" data-t="나라 상세" aria-label="나라 상세"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <button type="button" id="rKr" data-t="한국 제안값" aria-label="한국 제안값"><svg viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg></button>
  </nav>
  <div class="main">
    <header class="top"><h1>StableWatch 판정기</h1>
      <div class="r"><span class="notice">한국 열은 제안값이며 확정된 규정이 아닙니다</span><label>보고서 <select id="rep" aria-label="보고서 고르기"></select></label></div></header>

    <section class="home" id="home"></section>

    <div class="stage" id="stage">
      <div class="mark"><div class="wm" id="wm"></div><div class="sideL" id="sideL"></div></div>
      <div class="board">
        <section class="cardL" aria-live="polite">
          <div class="hd"><h2 id="name"></h2><div class="live"><span>법적 상태</span><b id="legal"></b></div></div>
          <div class="sun"><svg id="sunsvg" width="300" height="150" viewBox="0 0 300 150" aria-hidden="true"></svg><div class="n num" id="sunn"></div></div>
          <p class="desc" id="desc"></p>
        </section>
        <section class="cardR">
          <div class="tabs" role="tablist" id="tabs"></div>
          <div id="pane"></div>
        </section>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="나라 고르기"></nav>
    <p class="foot">한국 열은 제안값이며 확정된 규정이 아닙니다. 보고서 숫자는 회계법인 검증 보고서 PDF에서 읽었고, 판정은 코드로 짠 규칙으로만 합니다.</p>
  </div>
</div>
<script type="module">
import { evaluateReport, resolveRuleDef, STATUS, RULE_IDS, calendarDaysBetween } from './engine.js';

const REPORTS = (await (await fetch('data/reports.json')).json()).reports;
const JURS = Object.fromEntries(await Promise.all(['us','eu-emt','eu-emt-significant','hk','sg','kr-v1'].map(async (id) => [id, await (await fetch(`jurisdictions/${id}.json`)).json()])));
const C = {
  'us': { n: '미국', wm: 'U\nS\nA', lat: 1, own: ['USDC', 'PYUSD', 'USDP'], d: 'GENIUS법이 제정됐고 시행은 2027-01-18로 예정돼 있습니다. 통화감독청(OCC)의 세부 규칙 제안은 의견을 받는 중입니다.' },
  'eu-emt': { n: 'EU 일반', wm: 'E\nU', lat: 1, own: [], d: 'MiCA 규정이 시행 중입니다. 은행이 아닌 전자화폐 발행 기관이 내는 일반 전자화폐토큰에 적용됩니다.' },
  'eu-emt-significant': { n: 'EU 중요', wm: 'E\nU', lat: 1, own: [], d: 'MiCA 규정이 시행 중입니다. 규모가 큰 중요 토큰은 일반 토큰보다 강한 요건을 받습니다.' },
  'hk': { n: '홍콩', wm: '香\n港', own: [], d: '금융관리국(HKMA)의 감독지침이 2025-08-01부터 시행 중입니다. 2026-04-10에 첫 발행 인가 2건이 나왔습니다.' },
  'sg': { n: '싱가포르', wm: '新\n加\n坡', own: ['USDG'], d: '통화청(MAS)의 2023 프레임워크가 시행 중이고, 법 개정 자문 P015-2026이 2026-10-16까지 열려 있습니다.' },
  'kr-v1': { n: '한국', wm: '한\n국', own: [], d: '스테이블코인 법이 없고 정부안도 국회에 제출되지 않았습니다. 계류 중인 법안 8건과 공시안 제안값을 후보로 골라 판정합니다.' },
};
const ORDER = ['us', 'eu-emt', 'eu-emt-significant', 'hk', 'sg', 'kr-v1'];
const SHORT = { R01:'커버리지 100% 이상', R02:'허용 자산 종류', R03:'국채 만기 상한', R04:'레포 만기', R05:'은행 예금 최저 비율', R06:'준비금 통화 일치', R07:'공개 주기', R08:'검증 수준', R09:'검증 기준시각', R10:'공개 기한', R11:'발행잔액 계산식 공개', R12:'보관 기관 공개', R13:'돌려주는 조건', R14:'이자 지급 금지', R15:'경영진 서명' };
const ISSUER = { USDC:'Circle', PYUSD:'Paxos', USDP:'Paxos', USDG:'Paxos' };
const SEGS = [['bank','은행 예금'],['repo','하루짜리 담보 대출(레포)'],['mmf','국채 펀드'],['tsy','국채'],['oth','기타']];
// 홍콩 Anchorpoint HKDAP 주간 명세, 단위 백만 홍콩달러. 판정 엔진에는 넣지 않고 표시만 한다.
const HK = [['2026-08-19', 0.52, 1.62], ['2026-08-26', 0.57, 1.67], ['2026-09-02', 0.53, 1.63], ['2026-09-09', 0.78, 1.88], ['2026-09-16', 1.01, 2.11], ['2026-09-23', 1.01, 2.11]];
const $ = (id) => document.getElementById(id);
const state = { view: 'home', j: 'us', tab: 'rules', all: false, rule: null, r: Math.max(0, REPORTS.findIndex((x) => x.token === 'PYUSD')), cand: {} };

const pct = (x, d = 2) => (x * 100).toFixed(d) + '%';
const cls = (s) => s === STATUS.MET ? 'met' : s === STATUS.UNMET ? 'unmet' : s === STATUS.CAUTION ? 'caution' : '';
const label = (r) => `${ISSUER[r.token]} ${r.token} ${Number(r.month.slice(5))}월`;
const ownIdx = (j) => REPORTS.map((x, i) => C[j].own.includes(x.token) ? i : -1).filter((i) => i >= 0);
const days = (x) => calendarDaysBetween(x.as_of, x.attestation && x.attestation.signed);
function mix(r) { const c = r.components || {}, f = r.fair_value; const g = (k) => c[k] == null ? null : c[k] / f;
  return { bank: g('cash'), repo: g('repo'), mmf: g('government_mmf') ?? g('circle_reserve_fund'), tsy: g('treasury'), oth: g('other') }; }
function fmt(rule, v) {
  if (v == null) return '없음'; if (Array.isArray(v)) return v.join(', ');
  if (typeof v === 'number' && (rule === 'R01' || rule === 'R05')) return pct(v);
  if (typeof v === 'number' && rule === 'R10') return v + '일';
  if (v === 'same_as_peg') return '코인과 같은 통화'; if (v === true) return '예'; if (v === false) return '아니오'; return String(v);
}
const evalFor = (r, j) => evaluateReport(r, JURS[j], j === 'kr-v1' ? state.cand : {});
const propDays = JURS['kr-v1'].rules.R10.candidates.find((c) => c.id === 'proposal').deadline_days;

function sun(met, total) {
  const R = 118, cx = 150, cy = 150, y = cy - 2 * R * (met / total);
  return `<defs><clipPath id="cp"><rect x="0" y="${y}" width="300" height="150"/></clipPath></defs>
    <path d="M${cx - R},${cy} A${R},${R} 0 0,1 ${cx + R},${cy} Z" fill="rgba(58,66,80,.10)"/>
    <path d="M${cx - R},${cy} A${R},${R} 0 0,1 ${cx + R},${cy} Z" fill="var(--mark)" clip-path="url(#cp)"/>`;
}

{ const [h, t] = location.hash.slice(1).split('/'); if (h && JURS[h]) { state.j = h; state.view = 'detail'; if (t === 'reports') state.tab = 'reports'; } }

function renderHome(r) {
  const cc = r.components || {}; const bank = cc.cash != null ? cc.cash / r.fair_value : cc.other != null ? cc.other / r.fair_value : null;
  const d = REPORTS.map(days), top = Math.ceil(Math.max(propDays, ...d.filter((x) => x != null)) / 10) * 10 + 10, H = 210;
  const M = REPORTS.map(mix);
  $('home').innerHTML = `
    <h2 class="lede">${label(r)} 보고서를 여섯 나라 규칙에 맞춰 봤습니다</h2>
    <p class="sub">기준일 ${r.as_of}, ${r.attestation && r.attestation.firm ? r.attestation.firm + '가 ' : ''}${r.attestation && r.attestation.signed ? r.attestation.signed + '에 확인' : ''}. 아래 막대를 누르면 보고서가 바뀝니다.</p>
    <div class="stats">
      <div><span>커버리지</span><b class="num">${pct(r.coverage)}</b><small>준비금 ÷ 발행량, 100% 이상이 기준</small></div>
      <div><span>${cc.cash != null ? '은행 예금 비중' : '기타 준비자산 비중'}</span><b class="num">${bank == null ? '없음' : pct(bank)}</b><small>${cc.cash != null ? '준비금 중 은행 예금' : '은행 예금 칸이 없어 기타로 대신 계산'}, 제안값 15%</small></div>
      <div><span>서명까지 걸린 날</span><b class="num">${days(r) == null ? '없음' : days(r) + '일'}</b><small>기준일부터 회계법인 서명까지</small></div>
    </div>
    <div class="charts">
      <div class="ch"><h2>준비금 구성</h2><p>보고서 7건, 준비금 100% 기준. 점선은 공시안 제안 은행 예금 15%.</p>
        <div class="plot"><div class="gl" style="bottom:0"></div>${[0, 50, 100].map((p) => `<span class="ax num" style="bottom:${p}%">${p}%</span>`).join('')}
          <div class="cols">${REPORTS.map((x, i) => `<button type="button" class="col ${i === state.r ? 'on' : ''}" data-i="${i}" aria-label="${label(x)}">${SEGS.map(([k, n], si) => { const v = M[i][k]; return v == null || v === 0 ? '' : `<div class="sg k${si} ${si > 2 ? 'd' : ''} num" style="height:${v * 100}%" title="${n} ${pct(v)}">${v >= 0.08 ? Math.round(v * 100) + '%' : ''}</div>`; }).join('')}</button>`).join('')}</div>
          <div class="lim" style="bottom:15%"><span class="num">제안 15%</span></div></div>
        <div class="xl">${REPORTS.map((x, i) => `<div class="${i === state.r ? 'on' : ''}">${x.token}<br>${Number(x.month.slice(5))}월</div>`).join('')}</div>
        <div class="leg">${SEGS.map(([, n], si) => `<span><i class="k${si}"></i>${n}</span>`).join('')}</div></div>
      <div class="ch"><h2>서명까지 걸린 날</h2><p>기준일부터 회계법인 서명까지, 달력 기준 날수.</p>
        <div class="plot">${[0, 10, 20, 30, 40].filter((t) => t < top).map((t) => `<div class="gl" style="bottom:${t / top * H}px"></div><span class="ax num" style="bottom:${t / top * H}px">${t}</span>`).join('')}
          <div class="cols">${REPORTS.map((x, i) => `<button type="button" class="col dcol ${i === state.r ? 'on' : ''}" data-i="${i}" aria-label="${label(x)} ${d[i]}일"><i style="height:${d[i] == null ? 0 : d[i] / top * H}px"></i><span class="v num" style="bottom:${(d[i] || 0) / top * H}px">${d[i] == null ? '' : d[i]}</span></button>`).join('')}</div>
          <div class="lim" style="bottom:${propDays / top * H}px"><span class="num">공시안 제안 ${propDays}일</span></div></div>
        <div class="xl">${REPORTS.map((x, i) => `<div class="${i === state.r ? 'on' : ''}">${x.token}<br>${Number(x.month.slice(5))}월</div>`).join('')}</div></div>
    </div>
    <h2 class="sec">나라별 판정</h2><p class="sec">${label(r)}를 각 나라 규칙 15개에 맞춰 본 결과입니다. 나라를 누르면 상세가 열립니다.</p>
    <div class="cty">${ORDER.map((id) => { const V = evalFor(r, id), n = V.filter((v) => v.status === STATUS.MET).length, u = V.filter((v) => v.status === STATUS.UNMET).length;
      const own = id === 'hk' ? '홍콩 주간 명세 6주치' : C[id].own.length ? `이 나라 보고서 ${ownIdx(id).length}건` : '이 나라 보고서 없음';
      return `<button type="button" class="ct" data-j="${id}"><div class="t"><h3>${C[id].n}</h3><span>${JURS[id].legal_status}</span></div><div class="strip">${V.map((v) => `<i class="${cls(v.status)}" title="${v.rule} ${SHORT[v.rule]}: ${v.status}"></i>`).join('')}</div><p>충족 ${n}, 미충족 ${u}, 전체 15</p><p>${own}</p></button>`; }).join('')}</div>`;
  document.querySelectorAll('.col').forEach((b) => b.onclick = () => { state.r = Number(b.dataset.i); render(); });
  document.querySelectorAll('.ct').forEach((b) => b.onclick = () => go(b.dataset.j));
}

function go(j) {
  state.j = j; state.view = 'detail'; state.rule = null; state.all = false; state.tab = 'rules';
  const own = ownIdx(j); if (own.length && !own.includes(state.r)) state.r = own[own.length - 1];
  render(); window.scrollTo(0, 0);
}

function rulesPane(r, j) {
  const V = evalFor(r, j), cfg = JURS[j];
  const EMPTY = [STATUS.NO_DATA, STATUS.NOT_REGULATED];
  const judged = V.filter((v) => !EMPTY.includes(v.status));
  if (state.rule == null) state.rule = (judged[0] || V[0]).rule;
  const shown = V.filter((v) => state.all || !EMPTY.includes(v.status) || v.rule === state.rule);
  const hidden = V.length - shown.length;
  const own = ownIdx(j).includes(state.r);
  const who = `<div class="who">판정에 쓴 보고서: <b>${label(r)}</b>${own ? '' : `<br>${C[j].n}에는 발행사 보고서가 없어서, 위 해외 보고서를 ${C[j].n} 규칙에 맞춰 본 결과입니다. ${C[j].n} 회사의 실제 공시가 아닙니다.`}</div>`;
  const body = (v) => {
    const entry = cfg.rules[v.rule] || {};
    const def = resolveRuleDef(cfg, v.rule, j === 'kr-v1' ? state.cand[v.rule] : undefined) || {};
    const cands = j === 'kr-v1' && Array.isArray(entry.candidates) && entry.candidates.length > 1 ? entry.candidates : null;
    const chosen = cands ? (state.cand[v.rule] || entry.default_candidate || cands[0].id) : null;
    const why = { [STATUS.PENDING]: '법이 세부 값을 대통령령에 넘겨 아직 기준이 없습니다.', [STATUS.NOT_REGULATED]: '이 나라 규칙에는 이 항목이 없습니다.', [STATUS.UNRESEARCHED]: '근거를 아직 찾지 못했습니다.', [STATUS.NO_DATA]: '보고서에서 이 값을 읽지 못했습니다.' }[v.status];
    return `<div class="ib">
      ${why ? `<p>${why}</p>` : `<div class="row"><div><span>보고서 값</span><b class="num">${fmt(v.rule, v.value)}</b></div><div><span>기준</span><b class="num">${fmt(v.rule, v.threshold)}</b></div></div>`}
      ${(def.requirement || entry.requirement) ? `<p>${def.requirement || entry.requirement}</p>` : ''}
      ${v.article ? `<p class="art">근거 조문: ${v.article}</p>` : ''}
      ${v.approx ? `<p>Circle 보고서는 은행 예금을 따로 적지 않아 기타 준비자산 비중으로 대신 계산했습니다.</p>` : ''}
      ${v.url ? `<p><a href="${v.url}" target="_blank" rel="noopener">원문 열기</a></p>` : ''}
      ${cands ? `<div class="cands"><p>한국은 규정이 없어 후보값 중 하나를 골라 판정합니다.</p>${cands.map((c) => `<label><input type="radio" name="cand" value="${c.id}" ${c.id === chosen ? 'checked' : ''}><span>${c.label}</span></label>`).join('')}</div>` : ''}</div>`;
  };
  return who + shown.map((v) => `<div class="item ${v.rule === state.rule ? 'on' : ''}"><button type="button" class="ih" data-r="${v.rule}" aria-expanded="${v.rule === state.rule}"><span class="id">${v.rule}</span><span class="nm">${SHORT[v.rule]}</span><span class="st ${cls(v.status)}">${v.status}</span></button>${v.rule === state.rule ? body(v) : ''}</div>`).join('')
    + (hidden > 0 ? `<button type="button" class="more" id="more">판정이 나오지 않은 ${hidden}개 보기</button>` : state.all ? `<button type="button" class="more" id="more">판정이 나온 규칙만 보기</button>` : '');
}

function reportsPane(j) {
  if (j === 'hk') {
    const mx = Math.max(...HK.map((x) => x[2]));
    return `<span class="tag">회계법인 확인이 없는 회사 자체 공시</span>
      <p class="note">Anchorpoint HKDAP 주간 명세 6주치입니다. 기준은 수요일 오후 5시 홍콩 시간이고 금요일에 올라옵니다. 단위는 백만 홍콩달러이며 준비금은 전부 은행 예금입니다. 이 값은 판정에 넣지 않고 표시만 합니다.</p>
      ${HK.map(([dt, c, rs]) => `<div class="hkw"><div class="l"><b class="num">${dt}</b><span class="num">유통량 ${c.toFixed(2)}, 준비금 ${rs.toFixed(2)}</span></div><div class="trk" role="img" aria-label="${dt} 유통량 ${c} 준비금 ${rs}"><i class="a" style="width:${rs / mx * 100}%"></i><i class="b" style="width:${c / mx * 100}%"></i></div></div>`).join('')}
      <div class="leg2"><span><i style="background:var(--ink)"></i>유통량</span><span><i style="background:#B4BFCE"></i>준비금</span></div>
      <p class="note">9월 23일 명세 주석에 따르면 준비금이 유통량보다 1.1백만 홍콩달러 많으며, 이 차이는 발행사가 자기 돈으로 더 채운 몫입니다.</p>`;
  }
  const own = ownIdx(j);
  if (!own.length) return `<div class="none">${j === 'kr-v1' ? '한국에는 발행 전이라 보고서가 없습니다.<small>위 해외 보고서를 한국 후보값에 넣어 판정합니다.</small>' : '확보한 발행사 보고서가 없습니다.'}</div>`;
  return own.map((i) => { const x = REPORTS[i], m = mix(x), a = x.attestation || {}, on = i === state.r;
    const bank = m.bank != null ? pct(m.bank) : `예금 칸 없음, 기타 ${pct(m.oth)}`;
    return `<button type="button" class="rp ${on ? 'on' : ''}" data-i="${i}"><div class="h"><b>${label(x)}</b>${on ? '<em>판정에 쓰는 중</em>' : ''}</div><p class="is">${x.issuer}</p>
      <dl><div><dt>기준일</dt><dd class="num">${x.as_of}</dd></div><div><dt>커버리지</dt><dd class="num">${pct(x.coverage)}</dd></div><div><dt>서명일</dt><dd class="num">${a.signed || '없음'}</dd></div>
      <div><dt>검증인</dt><dd>${a.firm || '이미지 서명, 이름 확인 필요'}</dd></div><div><dt>서명까지 걸린 날</dt><dd class="num">${days(x) == null ? '없음' : days(x) + '일'}</dd></div><div><dt>은행 예금 비중</dt><dd class="num">${bank}</dd></div></dl></button>`; }).join('')
    + `<p class="note">${j === 'sg' ? '싱가포르 법인 발행분이며 싱가포르 검증 기준(SSAE 3000)으로 확인됐습니다. 보고서를 누르면 그 보고서로 판정이 바뀝니다.' : '보고서를 누르면 그 보고서로 판정이 바뀝니다.'}</p>`;
}

function render() {
  const r = REPORTS[state.r], j = state.j, home = state.view === 'home';
  $('home').classList.toggle('hide', !home); $('stage').classList.toggle('hide', home); $('nav').classList.toggle('hide', home);
  $('rHome').classList.toggle('on', home); $('rCty').classList.toggle('on', !home && j !== 'kr-v1'); $('rKr').classList.toggle('on', !home && j === 'kr-v1');
  $('rHome').onclick = () => { state.view = 'home'; render(); }; $('rCty').onclick = () => go(state.j === 'kr-v1' ? 'us' : state.j); $('rKr').onclick = () => go('kr-v1');
  const sl = $('rep'); sl.innerHTML = REPORTS.map((x, i) => `<option value="${i}" ${i === state.r ? 'selected' : ''}>${label(x)}</option>`).join(''); sl.onchange = () => { state.r = Number(sl.value); render(); };
  if (home) { renderHome(r); return; }
  const info = C[j], cfg = JURS[j], V = evalFor(r, j);
  const wm = $('wm'); wm.textContent = info.wm; wm.className = 'wm' + (info.lat ? ' lat' : '');
  $('sideL').textContent = `판정에 쓴 보고서 ${label(r)}, 기준일 ${r.as_of}`;
  $('name').textContent = info.n; $('legal').textContent = cfg.legal_status;
  const met = V.filter((v) => v.status === STATUS.MET).length, unmet = V.filter((v) => v.status === STATUS.UNMET).length;
  $('sunsvg').innerHTML = sun(met, 15); $('sunn').textContent = `충족 ${met}, 미충족 ${unmet}, 전체 15`;
  $('desc').innerHTML = info.d + (j === 'kr-v1' ? '<small>한국 열은 제안값이며 확정된 규정이 아닙니다.</small>' : '');
  const nRep = j === 'hk' ? HK.length : ownIdx(j).length;
  $('tabs').innerHTML = `<button type="button" role="tab" data-t="rules" aria-selected="${state.tab === 'rules'}">규칙</button><button type="button" role="tab" data-t="reports" aria-selected="${state.tab === 'reports'}">이 나라 보고서${nRep ? `, ${nRep}건` : ''}</button>`;
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { state.tab = b.dataset.t; render(); });
  $('pane').innerHTML = state.tab === 'rules' ? rulesPane(r, j) : reportsPane(j);
  const mb = $('more'); if (mb) mb.onclick = () => { state.all = !state.all; render(); };
  document.querySelectorAll('.ih').forEach((b) => b.onclick = () => { state.rule = state.rule === b.dataset.r ? '' : b.dataset.r; render(); });
  document.querySelectorAll('.rp').forEach((b) => b.onclick = () => { state.r = Number(b.dataset.i); render(); });
  document.querySelectorAll('input[name="cand"]').forEach((i) => i.onchange = () => { state.cand[state.rule] = i.value; render(); });
  $('nav').innerHTML = `<button type="button" id="all" aria-pressed="false">전체 보기<small>여섯 나라</small></button>` + ORDER.map((id) => {
    const m = evalFor(r, id).filter((x) => x.status === STATUS.MET).length;
    return `<button type="button" data-j="${id}" aria-pressed="${id === j}">${C[id].n}<small>충족 ${m}</small></button>`; }).join('');
  $('all').onclick = () => { state.view = 'home'; render(); };
  document.querySelectorAll('#nav button[data-j]').forEach((b) => b.onclick = () => go(b.dataset.j));
}
render();
</script>
</body>
</html>
